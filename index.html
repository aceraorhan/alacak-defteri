<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Alacak Defteri</title>
<meta name="description" content="Kime, ne kadar borç verdiğini ve hangi faiz oranıyla takip et." />
<meta name="theme-color" content="#8A6FA3" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Alacak Defteri" />
<style>
  :root {
    --bg: #EAE6DC;
    --paper: #FFFFFF;
    --paper-alt: #FBF9F4;
    --border: #DBD5C6;
    --ink: #2B2620;
    --muted: #7A7263;
    --muted2: #9B927E;
    --accent: #8A6FA3;
    --accent2: #B98CA6;
    --warn: #CE9271;
    --danger: #C4A9A0;
    --danger-text: #B23B3B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', serif;
    -webkit-font-smoothing: antialiased;
  }
  .sans {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  #app {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px calc(80px + env(safe-area-inset-bottom));
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .io-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .io-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: #4A4335;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .io-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .io-btn input[type="file"] {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); border: 0;
  }
  .hint {
    font-size: 12px;
    color: var(--muted2);
    margin-top: 8px;
  }
  .msg { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .summary-row { display: flex; gap: 12px; margin-bottom: 24px; }
  .summary-card {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .summary-card.accent { background: var(--accent); border: none; }
  .summary-label {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted2); margin-bottom: 4px;
  }
  .summary-card.accent .summary-label { color: rgba(255,255,255,0.75); }
  .summary-value { font-size: 20px; font-weight: 700; }
  .summary-card.accent .summary-value { color: #fff; }

  .card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 28px;
    box-shadow: 0 1px 2px rgba(43,38,32,0.04);
  }
  .field { display: flex; flex-direction: column; gap: 12px; }
  input[type="text"] {
    width: 100%;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 15px;
    background: var(--paper-alt);
    color: var(--ink);
  }
  input:focus-visible, button:focus-visible, label.io-btn:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .rate-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .rate-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .rate-btn {
    padding: 9px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #F4F1E9;
    color: #4A4335;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .rate-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rate-btn-small {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #F4F1E9;
    color: #4A4335;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .rate-btn-small.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rate-btn-small:disabled { opacity: 0.4; cursor: not-allowed; }

  .preview { font-size: 13px; color: var(--muted); padding-top: 2px; }
  .preview strong { color: var(--ink); }
  .error { font-size: 13px; color: var(--danger-text); }

  .add-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 16px; border-radius: 8px; border: none;
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }

  .empty {
    text-align: center; padding: 40px 20px; color: var(--muted2); font-size: 14px;
  }

  .notes { display: flex; flex-direction: column; gap: 10px; }
  .note {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .note-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .note-left { display: flex; gap: 10px; align-items: center; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: #F0E9E2;
    display: flex; align-items: center; justify-content: center; color: var(--accent2);
    flex-shrink: 0; font-size: 16px;
  }
  .note-name { font-weight: 700; font-size: 16px; }
  .note-date { font-size: 12px; color: var(--muted2); }
  .del-btn {
    background: none; border: none; cursor: pointer; color: var(--danger);
    padding: 6px; font-size: 16px; line-height: 1;
  }
  .note-actions { display: flex; align-items: center; }
  .edit-btn {
    background: none; border: none; cursor: pointer; color: var(--accent);
    padding: 6px; font-size: 16px; line-height: 1;
  }
  .edit-actions { display: flex; gap: 8px; }
  .edit-actions .add-btn { flex: 1; margin-top: 0; }
  .cancel-btn {
    padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--paper); color: #4A4335; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .note-rates { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .note-footer {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
    font-size: 13px; padding-top: 10px; border-top: 1px dashed #E4DFD2;
  }
  .note-footer .principal { color: var(--muted); }
  .note-footer .interest { color: var(--warn); }
  .note-footer .total { font-weight: 700; color: var(--ink); }

  .note.note-paid { opacity: 0.6; background: #F4F1E9; }
  .note.note-paid .note-footer span { text-decoration: line-through; }
  .paid-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #5C8A6A;
    background: #E4EDE6;
    border-radius: 5px;
    padding: 2px 7px;
    margin-left: 6px;
    vertical-align: middle;
    text-decoration: none;
  }
  .paid-toggle {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .paid-toggle.is-paid {
    border: 1px solid #B7CDBB;
    background: #E4EDE6;
    color: #4C7358;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
